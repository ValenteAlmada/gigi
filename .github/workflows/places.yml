name: Atualizar postos e antenas (Overpass)
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  places:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Overpass → data/places.json
        run: node tools/fetch-places.mjs
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places.json
          git diff --cached --quiet && echo "sem alterações" && exit 0
          git commit -m "dados: postos e antenas OSM (Overpass horário)"
          git push
